# Routes the app's single API address to the Supabase services, the way the
# Supabase CLI's gateway does. Each service sees paths without its prefix.
server {
  listen 8000;
  client_max_body_size 50m;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
  }

  location /functions/v1/ {
    proxy_pass http://functions:9000/;
  }

  # Email templates are fetched by the auth service.
  location /templates/ {
    alias /usr/share/nginx/templates/;
  }

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }
}