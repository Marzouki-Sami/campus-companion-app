name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity. If you run
# this app on a hosted project, add the repository secrets SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY and this workflow pings it twice a week. Without the
# secrets (the default) it does nothing.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping the API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "No Supabase secrets configured; nothing to do."
            exit 0
          fi
          curl -fsS --retry 3 "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
          echo "Supabase responded."