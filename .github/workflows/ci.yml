name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Firebase config from templates
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          sed 's/YOUR_PACKAGE_NAME/com.example.campus_companion/' android/app/google-services.json.example > android/app/google-services.json
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Firebase config from templates
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          sed 's/YOUR_PACKAGE_NAME/com.example.campus_companion/' android/app/google-services.json.example > android/app/google-services.json
      - run: flutter pub get
      # arm64 only: the build is ~3x faster and covers every modern phone
      - run: flutter build apk --debug --target-platform android-arm64
