name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # arm64 only: the build is ~3x faster and covers every modern phone
      - run: flutter build apk --debug --target-platform android-arm64

  # Builds the docker-compose stack from scratch, applies every migration and
  # loads the demo data, so the compose setup cannot silently rot.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node tool/compose_env.mjs
      - name: Pull images (the public registry sometimes rate-limits)
        run: |
          for attempt in 1 2 3 4; do
            docker compose pull --quiet && exit 0
            echo "Pull failed (attempt $attempt); retrying..."
            sleep $((attempt * 20))
          done
          exit 1
      - run: docker compose up -d
      - name: Migrate and seed
        run: docker compose run --rm seed
      - name: The gateway routes to the services
        run: |
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/functions/v1/admin-delete-user)" = 401
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      # Postgres, Auth, the REST API and Storage (photo bucket policies) are needed.
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,mailpit,postgres-meta,supavisor
      - run: supabase test db
