name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Firebase config from templates
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          sed 's/YOUR_PACKAGE_NAME/com.example.campus_companion/' android/app/google-services.json.example > android/app/google-services.json
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Firebase config from templates
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          sed 's/YOUR_PACKAGE_NAME/com.example.campus_companion/' android/app/google-services.json.example > android/app/google-services.json
      - run: flutter pub get
      - run: flutter build apk --debug
