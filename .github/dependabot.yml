version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      dart-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # The Android Gradle Plugin, Kotlin and Gradle versions are tied to the Flutter
    # SDK's templates; major jumps break the build and are done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
