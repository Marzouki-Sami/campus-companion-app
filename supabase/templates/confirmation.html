<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#f4f5fb;font-family:Arial,Helvetica,sans-serif;color:#1c1d2b;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;">
      <tr>
        <td>
          <h1 style="margin:0 0 8px;font-size:22px;">Verify your email</h1>
          <p style="margin:0 0 24px;line-height:1.5;color:#52546a;">
            Enter this code in Campus Companion to finish creating your account.
          </p>
          <p style="margin:0 0 24px;padding:16px;text-align:center;font-size:32px;letter-spacing:8px;font-weight:bold;background:#eef0ff;border-radius:12px;color:#3b5be8;">
            {{ .Token }}
          </p>
          <p style="margin:0;line-height:1.5;font-size:13px;color:#7b7d92;">
            The code expires in 15 minutes. If you did not create an account, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
